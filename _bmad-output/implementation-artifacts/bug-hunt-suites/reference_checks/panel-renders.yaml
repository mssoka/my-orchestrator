name: "Reference Panel - Renders Both Rows with Correct Status Pills"
description: |
  Regression gate (round 1: #611/#612/#613/#615 verification). The landlord
  reference panel on the application detail page renders both reference rows
  (landlord_ref + employer_ref), shows the correct status pill per row, and
  expanding the in-flight row reveals the server-built attempt log with the
  export affordance.

  RUNNER PROTOCOL (fixture-dependent):
  - Seed: python3 /tmp/refcheck-bughunt2/seed-refcheck-fixture.py with
    BUG_HUNT_BASE_URL + DB_CONTAINER + DB_NAME pointed at the sandbox
    (vacancy "Refcheck Verification Flat", app "RefcheckRenders Fixture").
  - Run against the sandbox base URL (NOT the bare localhost:4000 default —
    the fixture lives in the sandbox DB).
  - Landlord must be logged in (auth state cached per env).

  Field-notes lessons applied: every Lustre-button click uses the native
  `.click()` eval fallback (agent-browser click @ref silently no-ops on
  Lustre buttons); no timing gates needed here (no submits).
priority: high
tags: [reference_checks, panel, regression, smoke]

preconditions:
  - "RightTenantry app running"
  - "Landlord logged in"
  - "reference_checks fixture seeded (RefcheckRenders Fixture)"

steps:
  - action: navigate
    url: /dashboard
    description: "Go to the dashboard"

  - action: wait
    for: "element"
    selector: '[data-testid="page-dashboard"]'
    timeout: 10000
    description: "Dashboard renders"

  - action: javascript
    description: "Open the fixture vacancy from the dashboard"
    code: |
      const card = Array.from(document.querySelectorAll('[data-testid^="vacancy-card-"]'))
        .find(c => (c.innerText || '').includes('Refcheck Verification Flat'));
      if (!card) throw new Error('fixture vacancy not found — run seed-refcheck-fixture.py');
      card.scrollIntoView({ block: 'center' });
      card.click();
      return 'fixture vacancy clicked';

  - action: wait
    for: "element"
    selector: '[data-testid="page-vacancy-detail"]'
    timeout: 10000
    description: "Vacancy detail renders"

  - action: javascript
    description: "Open the RefcheckRenders application from the leaderboard"
    code: |
      const row = Array.from(document.querySelectorAll('[data-testid^="leaderboard-row-link-"]'))
        .find(r => (r.innerText || '').includes('RefcheckRenders Fixture'));
      if (!row) throw new Error('RefcheckRenders Fixture leaderboard row not found');
      row.scrollIntoView({ block: 'center' });
      row.click();
      return 'application opened';

  - action: wait
    for: "element"
    selector: '[data-testid="page-application-detail"]'
    timeout: 10000
    description: "Application detail renders"

  - action: wait
    for: "element"
    selector: '[data-testid="refcheck-card"]'
    timeout: 10000
    description: "Reference panel renders"

  - action: verify
    checks:
      - type: element_count
        selector: '[data-testid="refcheck-card"]'
        exact: 1
      - type: element_count
        selector: '[data-testid="refcheck-row-landlord_ref"]'
        exact: 1
      - type: element_count
        selector: '[data-testid="refcheck-row-employer_ref"]'
        exact: 1
      - type: element_count
        selector: '[data-testid="refcheck-explainer"]'
        exact: 1
    description: "Card, explainer and both rows present"

  - action: javascript
    description: "Read both status pills (landlord_ref in-flight, employer_ref queued)"
    code: |
      const pill = slot => {
        const el = document.querySelector('[data-testid="refcheck-status-' + slot + '"]');
        return el ? el.innerText.trim() : '(missing)';
      };
      return JSON.stringify({
        landlord_ref: pill('landlord_ref'),
        employer_ref: pill('employer_ref'),
      });

  - action: verify
    checks:
      - type: text_visible
        selector: '[data-testid="refcheck-status-landlord_ref"]'
        text: "Invitation sent"
      - type: text_visible
        selector: '[data-testid="refcheck-status-employer_ref"]'
        text: "Queued"
    description: "landlord_ref shows Invitation sent, employer_ref shows Queued"

  - action: javascript
    description: "Expand the in-flight landlord_ref row (native click fallback)"
    code: |
      const btn = document.querySelector('[data-testid="refcheck-expand-landlord_ref"]');
      if (!btn) throw new Error('expand button missing');
      if (btn.getAttribute('aria-expanded') === 'true') return 'already expanded';
      btn.click();
      return 'expanded';

  - action: wait
    for: "element"
    selector: '[data-testid="refcheck-export-landlord_ref"]'
    timeout: 5000
    description: "Attempt log block with export affordance renders on expand"

  - action: verify
    checks:
      - type: text_visible
        text: "ATTEMPT LOG"
      - type: text_visible
        text: "Export attempt log"
    description: "Attempt log title (CSS-uppercased to ATTEMPT LOG) + export button visible"

  - action: javascript
    description: "Collapse landlord_ref, expand the queued employer_ref row"
    code: |
      document.querySelector('[data-testid="refcheck-expand-landlord_ref"]')?.click();
      const btn = document.querySelector('[data-testid="refcheck-expand-employer_ref"]');
      if (!btn) throw new Error('employer expand button missing');
      btn.click();
      return 'employer row expanded';

  - action: wait
    for: "sleep"
    duration: 800
    description: "Let the re-render settle"

  - action: verify
    checks:
      - type: text_visible
        text: "Starts automatically when you mark the viewing as done."
    description: "Queued row state copy renders"

expected_outcome: "Reference panel renders both rows with correct pills; in-flight row expands to the attempt log with export; queued row expands to its state copy."
