name: "Referee Form - Complete Walkthrough (Landlord Reference)"
description: |
  Regression gate (round 1: referee-form-complete). Drives the full referee
  form for the fixture landlord_ref call: landing page → identity (Yes) →
  10 answer questions (radios / tenancy-period from+ongoing / rent amount /
  free text) → review screen → "Send my reference" → thank-you. Each answer
  POST is timing-gated (500ms floor) so every continue is preceded by a 2s
  pause; the final submit keeps a 3s pause.

  STACKED-FORMS TRAP (field-notes): the form page renders ALL question
  forms stacked in the DOM. On DESKTOP the questions stay visible and
  `data-current` is a server-side marker that does NOT advance in place
  (the reference_form.js `showOnly` stepper is mobile-only). Every continue
  click is therefore scoped to its own `[data-question="<id>"]` form —
  an unscoped click re-submits the first (identity) form forever.

  VALIDATION NOTES (verified live): `a_tenancy_from` (YYYY-MM) is required
  even when the "ongoing" checkbox is set; the rent amount input testid is
  `reference-input-a_rent_amount`; the free_text question is optional.

  RUNNER PROTOCOL:
  - Seed: python3 /tmp/refcheck-bughunt2/seed-refcheck-fixture.py (sandbox).
  - Resolve the live form token from /tmp/refcheck-fixture-report.json
    (`form_token` — the fixture's landlord_ref is contact_initiated with a
    live token) and run with REFCHECK_FORM_TOKEN=<token>.
  - No auth needed (public route). Run against the sandbox base URL.

priority: critical
tags: [reference_checks, referee-form, smoke, regression]

preconditions:
  - "RightTenantry app running"
  - "reference_checks fixture seeded (form_token in fixture report)"
  - "REFCHECK_FORM_TOKEN env var set to the fixture's live form token"

steps:
  - action: navigate
    url: /reference/${REFCHECK_FORM_TOKEN}
    description: "Open the referee form landing page (SSR — ready on load)"

  - action: wait
    for: "element"
    selector: '[data-testid="reference-landing"]'
    timeout: 5000

  - action: verify
    checks:
      - type: element_count
        selector: '[data-testid="reference-start"]'
        exact: 1
      - type: element_count
        selector: '[data-testid="reference-wrong-person-link"]'
        exact: 1
      - type: element_count
        selector: '[data-testid="reference-decline-link"]'
        exact: 1
    description: "Landing page shows Start + escape links (wrong-person, decline)"

  - action: javascript
    description: "Start the form (plain anchor — native click)"
    code: |
      const start = document.querySelector('[data-testid="reference-start"]');
      if (!start) throw new Error('start link missing');
      start.click();
      return 'started';

  - action: wait
    for: "element"
    selector: '[data-testid="reference-form-page"]'
    timeout: 5000
    description: "Form page renders (all question forms stacked)"

  - action: javascript
    description: "Pre-fill ALL question answers (scoped per [data-question]) before stepping"
    code: |
      const q = id => document.querySelector('[data-question="' + id + '"]');
      if (!q('relationship')) throw new Error('stacked question forms not present');
      const setRadio = (qid, value) => {
        const el = q(qid).querySelector('input[type="radio"][value="' + value + '"]');
        if (!el) throw new Error('missing radio ' + qid + '=' + value);
        el.checked = true;
        el.dispatchEvent(new Event('change', { bubbles: true }));
      };
      const setText = (qid, testid, value) => {
        const el = q(qid).querySelector('[data-testid="' + testid + '"]');
        if (!el) throw new Error('missing input ' + testid);
        el.value = value;
        el.dispatchEvent(new Event('input', { bubbles: true }));
      };
      const setCheck = (qid, testid) => {
        const el = q(qid).querySelector('[data-testid="' + testid + '"]');
        if (!el) throw new Error('missing checkbox ' + testid);
        el.checked = true;
        el.dispatchEvent(new Event('change', { bubbles: true }));
      };
      setRadio('relationship', 'landlord');
      setRadio('tenancy_confirmed', 'yes');
      // tenancy_period: the from-month is REQUIRED even when ongoing.
      setText('tenancy_period', 'reference-input-tenancy_from', '2024-09');
      setCheck('tenancy_period', 'reference-input-tenancy_ongoing');
      setText('rent_amount', 'reference-input-a_rent_amount', '1200');
      setRadio('rent_payment_record', 'always_on_time');
      setRadio('property_condition', 'good');
      setRadio('notice_given_properly', 'yes');
      setRadio('deposit_returned', 'in_full');
      setRadio('would_rent_again', 'yes');
      setText('free_text', 'reference-input-free_text', 'FIXTURE landlord reference — everything on time, no issues.');
      return 'all answers pre-filled';

  # --- Step through identity + the 10 answer questions. Each continue is
  # id-scoped to its own form (desktop: data-current never advances in
  # place). 2s pause before each POST satisfies the 500ms timing floor.

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the identity answer POST"

  - action: javascript
    description: "Answer identity (Yes)"
    code: |
      const btn = document.querySelector('[data-question="identity"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('identity continue missing');
      btn.click();
      return 'identity answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the relationship answer POST"

  - action: javascript
    description: "Continue past relationship"
    code: |
      const btn = document.querySelector('[data-question="relationship"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'relationship answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the tenancy_confirmed answer POST"

  - action: javascript
    description: "Continue past tenancy_confirmed"
    code: |
      const btn = document.querySelector('[data-question="tenancy_confirmed"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'tenancy_confirmed answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the tenancy_period answer POST"

  - action: javascript
    description: "Continue past tenancy_period"
    code: |
      const btn = document.querySelector('[data-question="tenancy_period"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'tenancy_period answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the rent_amount answer POST"

  - action: javascript
    description: "Continue past rent_amount"
    code: |
      const btn = document.querySelector('[data-question="rent_amount"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'rent_amount answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the rent_payment_record answer POST"

  - action: javascript
    description: "Continue past rent_payment_record"
    code: |
      const btn = document.querySelector('[data-question="rent_payment_record"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'rent_payment_record answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the property_condition answer POST"

  - action: javascript
    description: "Continue past property_condition"
    code: |
      const btn = document.querySelector('[data-question="property_condition"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'property_condition answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the notice_given_properly answer POST"

  - action: javascript
    description: "Continue past notice_given_properly"
    code: |
      const btn = document.querySelector('[data-question="notice_given_properly"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'notice_given_properly answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the deposit_returned answer POST"

  - action: javascript
    description: "Continue past deposit_returned"
    code: |
      const btn = document.querySelector('[data-question="deposit_returned"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'deposit_returned answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the would_rent_again answer POST"

  - action: javascript
    description: "Continue past would_rent_again"
    code: |
      const btn = document.querySelector('[data-question="would_rent_again"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'would_rent_again answered';

  - action: wait
    for: "sleep"
    duration: 2000
    description: "Timing gate before the free_text answer POST"

  - action: javascript
    description: "Continue past the optional free_text (last question — navigates to review)"
    code: |
      const btn = document.querySelector('[data-question="free_text"] [data-testid="reference-continue"]');
      if (!btn) throw new Error('continue missing');
      btn.click();
      return 'free_text answered';

  - action: wait
    for: "element"
    selector: '[data-testid="reference-review"]'
    timeout: 8000
    description: "Review screen renders after the last answer"

  - action: verify
    checks:
      - type: element_count
        selector: '[data-testid="reference-review-form"]'
        exact: 1
      - type: element_count
        selector: '[data-testid="reference-submit"]'
        exact: 1
    description: "Review form + submit button present"

  - action: wait
    for: "sleep"
    duration: 3000
    description: "Timing gate before the final submit POST"

  - action: javascript
    description: "Send my reference (submit POST)"
    code: |
      const submit = document.querySelector('[data-testid="reference-submit"]');
      if (!submit) throw new Error('submit button missing');
      submit.click();
      return 'submitted';

  - action: wait
    for: "element"
    selector: '[data-testid="reference-thank-you-privacy-link"]'
    timeout: 8000
    description: "Thank-you page renders"

  - action: verify
    checks:
      - type: text_visible
        text: "Thank you. That's everything."
    description: "Thank-you copy confirms the form completed"

expected_outcome: "The landlord reference form walks identity + 10 questions to the review screen and submits cleanly to the thank-you page (no stacked-form re-submit, no timing-gate rejection)."
