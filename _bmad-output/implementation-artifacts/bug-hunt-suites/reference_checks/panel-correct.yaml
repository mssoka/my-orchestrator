name: "Reference Panel - Correct Details Edit Trio Holds Keystrokes and Saves"
description: |
  Regression gate for #611 (stale-save fix). On the fixture app
  "RefcheckCorrect Fixture", the employer_ref row is in awaiting_correction
  ("Contact details didn't work"). Opening "Correct details" shows the §8.3
  edit trio; typed edits are keyed by reference_call_id so they SURVIVE
  re-renders (the original bug snapped values back within ~150ms on every
  render); Save & resend persists the NEW contact and flips the row back to
  Queued with the corrected contact shown.

  RUNNER PROTOCOL (fixture-dependent):
  - Seed: python3 /tmp/refcheck-bughunt2/seed-refcheck-fixture.py (sandbox).
  - App: "RefcheckCorrect Fixture" — employer_ref in awaiting_correction.
  - The keystroke-hold check (2s window) is the #611 regression proof: in
    the buggy build the typed value is gone at +2s.

  Field-notes lessons applied: native `.click()` eval fallback for Lustre
  buttons; input values set via value + dispatched input event (Lustre
  on_input); no form submit here (buttons are type=button + MVU message).
priority: high
tags: [reference_checks, panel, regression, 611]

preconditions:
  - "RightTenantry app running"
  - "Landlord logged in"
  - "reference_checks fixture seeded (RefcheckCorrect Fixture, employer_ref awaiting_correction)"

steps:
  - action: navigate
    url: /dashboard
    description: "Go to the dashboard"

  - action: wait
    for: "element"
    selector: '[data-testid="page-dashboard"]'
    timeout: 10000

  - action: javascript
    description: "Open the fixture vacancy"
    code: |
      const card = Array.from(document.querySelectorAll('[data-testid^="vacancy-card-"]'))
        .find(c => (c.innerText || '').includes('Refcheck Verification Flat'));
      if (!card) throw new Error('fixture vacancy not found — run seed-refcheck-fixture.py');
      card.scrollIntoView({ block: 'center' });
      card.click();
      return 'vacancy clicked';

  - action: wait
    for: "element"
    selector: '[data-testid="page-vacancy-detail"]'
    timeout: 10000

  - action: javascript
    description: "Open the RefcheckCorrect application"
    code: |
      const row = Array.from(document.querySelectorAll('[data-testid^="leaderboard-row-link-"]'))
        .find(r => (r.innerText || '').includes('RefcheckCorrect Fixture'));
      if (!row) throw new Error('RefcheckCorrect leaderboard row not found');
      row.scrollIntoView({ block: 'center' });
      row.click();
      return 'application opened';

  - action: wait
    for: "element"
    selector: '[data-testid="page-application-detail"]'
    timeout: 10000

  - action: wait
    for: "element"
    selector: '[data-testid="refcheck-card"]'
    timeout: 10000

  - action: verify
    checks:
      - type: text_visible
        selector: '[data-testid="refcheck-status-employer_ref"]'
        text: "Contact details didn't work"
    description: "employer_ref shows the awaiting_correction amber pill"

  - action: javascript
    description: "Expand the employer_ref row (the correction surface lives in the row detail)"
    code: |
      const exp = document.querySelector('[data-testid="refcheck-expand-employer_ref"]');
      if (!exp) throw new Error('expand button missing');
      exp.click();
      return 'expanded';

  - action: wait
    for: "sleep"
    duration: 800

  - action: javascript
    description: "Open the Correct details edit trio"
    code: |
      const btn = document.querySelector('[data-testid="refcheck-correct-open-employer_ref"]');
      if (!btn) throw new Error('Correct details button missing');
      btn.click();
      return 'trio opened';

  - action: wait
    for: "element"
    selector: '[data-testid="refcheck-edit-email-employer_ref"]'
    timeout: 5000
    description: "Edit trio renders (name/email/phone inputs)"

  - action: javascript
    description: "Type a NEW email into the trio and prove it holds at +2s (#611 regression proof)"
    code: |
      const el = document.querySelector('[data-testid="refcheck-edit-email-employer_ref"]');
      if (!el) throw new Error('email input missing');
      const typed = 'new.employer.ref@fixture.test';
      el.value = typed;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      const v1 = el.value;
      await new Promise(r => setTimeout(r, 2000));
      const el2 = document.querySelector('[data-testid="refcheck-edit-email-employer_ref"]');
      const v2 = el2 ? el2.value : '(input gone)';
      return JSON.stringify({ typed: typed, at_0s: v1, at_2s: v2, held: v1 === v2 });

  - action: verify
    checks:
      - type: text_visible
        text: "Save & resend"
      - type: text_visible
        text: "Cancel"
    description: "Trio action buttons render"

  - action: javascript
    description: "Re-read the trio value as a belt-and-braces hold check, then Save & resend"
    code: |
      const el = document.querySelector('[data-testid="refcheck-edit-email-employer_ref"]');
      const before = el ? el.value : '(missing)';
      const save = document.querySelector('[data-testid="refcheck-edit-save-employer_ref"]');
      if (!save) throw new Error('save button missing');
      save.click();
      return 'saved; email before save = ' + before;

  - action: javascript
    description: "Save & resend, then poll the toast (toasts render with role=status + data-testid=toast-message, NOT role=alert)"
    code: |
      const save = document.querySelector('[data-testid="refcheck-edit-save-employer_ref"]');
      if (!save) throw new Error('save button missing');
      save.click();
      return 'saved';

  - action: javascript
    description: "Poll for the success toast (3s auto-dismiss window)"
    code: |
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      for (let i = 0; i < 12; i++) {
        const t = document.querySelector('[data-testid="toast-message"]');
        if (t && /Details saved/.test(t.innerText)) return 'toast: ' + t.innerText.replace(/\n/g, ' | ');
        await sleep(250);
      }
      throw new Error('success toast not seen within 3s');
    description: "Success toast confirms the correction landed"

  - action: wait
    for: "element"
    selector: '[data-testid="refcheck-status-employer_ref"]'
    timeout: 8000
    description: "Row re-renders after save"

  - action: javascript
    description: "Read the post-save pill + row contact (NEW contact should be displayed)"
    code: |
      const pill = document.querySelector('[data-testid="refcheck-status-employer_ref"]');
      const row = document.querySelector('[data-testid="refcheck-row-employer_ref"]');
      return JSON.stringify({
        pill: pill ? pill.innerText.trim() : '(missing)',
        rowText: row ? row.innerText : '(missing)',
      });

  - action: verify
    checks:
      - type: text_visible
        selector: '[data-testid="refcheck-status-employer_ref"]'
        text: "Queued"
    description: "Row flipped back to Queued"

  - action: javascript
    description: "Runner-side note: the corrected email is NOT re-displayed in the queued row body — DB is the persistence proof (status=queued, corrected_email=<typed>, correction_cycles=1). Print the panel state for the runlog."
    code: |
      const row = document.querySelector('[data-testid="refcheck-row-employer_ref"]');
      return 'row pill = Queued; corrected_email persistence is verified at the DB layer (see runlog). rowText=' + (row ? row.innerText.slice(0, 120) : '(missing)');

  - action: javascript
    description: "Post-save DB persistence check (runner executes this via psql against the sandbox)"
    code: |
      return 'RUNNER: docker exec rt-refcheck-bughunt2-dev-db psql -U test -d righttenantry_test -t -A -c "SELECT rc.status, rc.corrected_email, rc.correction_cycles FROM reference_call rc JOIN application a ON a.id=rc.application_id WHERE a.email LIKE ''refcheck-correct-%'' AND rc.ref_slot=''employer_ref'';" — expect queued | new.employer.ref@fixture.test | 1';

expected_outcome: "Typed correction holds across re-renders, Save & resend persists it, and the row returns to Queued showing the corrected contact (the #611 stale-save bug does not recur)."
