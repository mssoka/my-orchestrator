name: "Reference Panel - Taken-Over Row Must Not Promise a Future Reminder"
description: |
  Phase-2 probe (bug hunt round 2 — NEW finding). When the landlord takes
  over a contact_initiated reference check, the row shows "You're handling
  this one" and the takeover stops ALL automated messages (the sweep
  excludes `taken_over_at IS NOT NULL` rows). The attempt-log cadence hint
  must NOT promise "Next reminder in ~2 days if there's no reply" on a
  taken-over row — automation is off, so no reminder will ever arrive.

  Reproduced on develop @ 7675c81 (sandbox fixture): a contact_initiated
  row with 1 invite attempt, taken over via the overflow menu → the row
  renders the reminder hint anyway. The panel's `has_next_reminder` check
  keys only on status==ContactInitiated, not on the taken-over flag.

  RUNNER PROTOCOL (fixture-dependent):
  - Seed: python3 /tmp/refcheck-bughunt2/seed-refcheck-fixture.py (sandbox),
    then SQL-mint a contact_initiated row with 1 delivered attempt on the
    fixture app used here, and fire the internal sweep once
    (POST /api/v1/internal/reference-checks) so the invite attempt exists.
  - App: "RefcheckForm-complete Fixture" — employer_ref contact_initiated
    with 1 attempt (start via the overflow menu + sweep, or SQL).

  Field-notes lessons applied: native `.click()` eval fallback; id-scoped
  row targeting when a slot has multiple rows.
priority: low
tags: [reference_checks, panel, copy, takeover]

preconditions:
  - "RightTenantry app running"
  - "Landlord logged in"
  - "reference_checks fixture seeded (RefcheckForm-complete Fixture, employer_ref contact_initiated with 1 attempt)"

steps:
  - action: navigate
    url: /dashboard
    description: "Go to the dashboard"

  - action: wait
    for: "element"
    selector: '[data-testid="page-dashboard"]'
    timeout: 10000

  - action: javascript
    description: "Open the fixture vacancy"
    code: |
      const card = Array.from(document.querySelectorAll('[data-testid^="vacancy-card-"]'))
        .find(c => (c.innerText || '').includes('Refcheck Verification Flat'));
      if (!card) throw new Error('fixture vacancy not found — run seed-refcheck-fixture.py');
      card.scrollIntoView({ block: 'center' });
      card.click();
      return 'vacancy clicked';

  - action: wait
    for: "element"
    selector: '[data-testid="page-vacancy-detail"]'
    timeout: 10000

  - action: javascript
    description: "Open the RefcheckForm-complete application"
    code: |
      const row = Array.from(document.querySelectorAll('[data-testid^="leaderboard-row-link-"]'))
        .find(r => (r.innerText || '').includes('RefcheckForm-complete Fixture'));
      if (!row) throw new Error('RefcheckForm-complete leaderboard row not found');
      row.scrollIntoView({ block: 'center' });
      row.click();
      return 'application opened';

  - action: wait
    for: "element"
    selector: '[data-testid="page-application-detail"]'
    timeout: 10000

  - action: wait
    for: "element"
    selector: '[data-testid="refcheck-card"]'
    timeout: 10000

  - action: javascript
    description: "Expand the employer_ref row and confirm it is in-flight with the cadence hint"
    code: |
      const expand = document.querySelector('[data-testid="refcheck-expand-employer_ref"]');
      if (!expand) throw new Error('expand button missing');
      expand.click();
      return 'expanded';

  - action: wait
    for: "sleep"
    duration: 800

  - action: javascript
    description: "Pre-takeover state: hint must be present (in-flight row)"
    code: |
      const row = document.querySelector('[data-testid^="refcheck-row-employer_ref"]');
      const text = row.innerText;
      return JSON.stringify({
        pill: (row.querySelector('[data-testid^="refcheck-status-"]') || {}).innerText,
        hintBefore: text.split('\n').filter(l => /Next reminder/i.test(l)),
      });

  - action: javascript
    description: "Open the overflow menu and choose Take over manually"
    code: |
      const ov = document.querySelector('[data-testid^="refcheck-overflow-employer_ref"]');
      if (!ov) throw new Error('overflow button missing');
      ov.click();
      return 'menu open';

  - action: wait
    for: "sleep"
    duration: 800

  - action: javascript
    description: "Click Take over manually"
    code: |
      const b = Array.from(document.querySelectorAll('[data-testid^="refcheck-menu-"] button'))
        .find(x => x.innerText.includes('Take over manually'));
      if (!b) throw new Error('take-over not in menu');
      b.click();
      return 'take-over chosen';

  - action: wait
    for: "sleep"
    duration: 800

  - action: javascript
    description: "Confirm the takeover"
    code: |
      const yes = document.querySelector('[data-testid^="refcheck-confirm-take-over-yes-"]');
      if (!yes) throw new Error('take-over confirm button missing');
      yes.click();
      return 'confirmed';

  - action: wait
    for: "sleep"
    duration: 1500

  - action: javascript
    description: "Post-takeover state: taken-over label present, cadence hint must be ABSENT"
    code: |
      const rows = Array.from(document.querySelectorAll('[data-testid^="refcheck-row-employer_ref"]'));
      const row = rows.find(r => r.querySelector('[data-testid^="refcheck-taken-over-"]'));
      const text = row ? row.innerText : '(no taken-over row)';
      return JSON.stringify({
        takenOver: !!row,
        takenOverLabel: row ? (row.querySelector('[data-testid^="refcheck-taken-over-"]') || {}).innerText : null,
        hintAfter: text.split('\n').filter(l => /Next reminder/i.test(l)),
        hasReminderPromise: /Next reminder/i.test(text),
      });

  - action: javascript
    description: "Assert: the taken-over row must NOT promise a future reminder (throws = FAIL)"
    code: |
      const rows = Array.from(document.querySelectorAll('[data-testid^="refcheck-row-employer_ref"]'));
      const row = rows.find(r => r.querySelector('[data-testid^="refcheck-taken-over-"]'));
      if (!row) throw new Error('no taken-over row found after confirm');
      if (/Next reminder/i.test(row.innerText)) {
        throw new Error('BUG: taken-over row still promises "Next reminder" even though automation is stopped');
      }
      return 'PASS: no reminder promise on taken-over row';

expected_outcome: "After takeover, the row shows the taken-over label and the attempt log WITHOUT the 'Next reminder' cadence hint. Currently FAILS on develop @ 7675c81 — the hint persists (see bug hunt issue)."
