name: "Reference Panel - Substitute Referee Creates a New Queued Row"
description: |
  Regression gate for #611 (substitute flow). On the fixture app
  "RefcheckSubstitute Fixture", the landlord_ref row is terminal `objected`
  ("Declined contact") with the "Substitute referee" affordance. Opening it
  shows the §8.3 edit trio starting EMPTY (the objected referee's own
  contact is never the prefill); typed values hold across re-renders; Save &
  send invite creates a NEW queued landlord_ref row with the substituted
  contact, while the old objected row stays terminal.

  RUNNER PROTOCOL (fixture-dependent):
  - Seed: python3 /tmp/refcheck-bughunt2/seed-refcheck-fixture.py (sandbox).
  - App: "RefcheckSubstitute Fixture" — landlord_ref in objected.

  Field-notes lessons applied: native `.click()` eval fallback; input values
  via value + dispatched input event; substitute trio must START EMPTY
  (r4 N18 — the terminal referee's contact is never the fallback prefill).
priority: high
tags: [reference_checks, panel, regression, 611]

preconditions:
  - "RightTenantry app running"
  - "Landlord logged in"
  - "reference_checks fixture seeded (RefcheckSubstitute Fixture, landlord_ref objected)"

steps:
  - action: navigate
    url: /dashboard
    description: "Go to the dashboard"

  - action: wait
    for: "element"
    selector: '[data-testid="page-dashboard"]'
    timeout: 10000

  - action: javascript
    description: "Open the fixture vacancy"
    code: |
      const card = Array.from(document.querySelectorAll('[data-testid^="vacancy-card-"]'))
        .find(c => (c.innerText || '').includes('Refcheck Verification Flat'));
      if (!card) throw new Error('fixture vacancy not found — run seed-refcheck-fixture.py');
      card.scrollIntoView({ block: 'center' });
      card.click();
      return 'vacancy clicked';

  - action: wait
    for: "element"
    selector: '[data-testid="page-vacancy-detail"]'
    timeout: 10000

  - action: javascript
    description: "Open the RefcheckSubstitute application"
    code: |
      const row = Array.from(document.querySelectorAll('[data-testid^="leaderboard-row-link-"]'))
        .find(r => (r.innerText || '').includes('RefcheckSubstitute Fixture'));
      if (!row) throw new Error('RefcheckSubstitute leaderboard row not found');
      row.scrollIntoView({ block: 'center' });
      row.click();
      return 'application opened';

  - action: wait
    for: "element"
    selector: '[data-testid="page-application-detail"]'
    timeout: 10000

  - action: wait
    for: "element"
    selector: '[data-testid="refcheck-card"]'
    timeout: 10000

  - action: verify
    checks:
      - type: text_visible
        selector: '[data-testid="refcheck-status-landlord_ref"]'
        text: "Declined contact"
    description: "landlord_ref shows the objected pill"

  - action: javascript
    description: "Expand the landlord_ref row (the substitute affordance lives in the row detail)"
    code: |
      const exp = document.querySelector('[data-testid="refcheck-expand-landlord_ref"]');
      if (!exp) throw new Error('expand button missing');
      exp.click();
      return 'expanded';

  - action: wait
    for: "sleep"
    duration: 800

  - action: javascript
    description: "Open the Substitute referee edit trio"
    code: |
      const btn = document.querySelector('[data-testid="refcheck-substitute-open-landlord_ref"]');
      if (!btn) throw new Error('Substitute referee button missing');
      btn.click();
      return 'substitute trio opened';

  - action: wait
    for: "element"
    selector: '[data-testid="refcheck-edit-name-landlord_ref"]'
    timeout: 5000

  - action: javascript
    description: "The trio starts EMPTY (never the objected referee's own contact)"
    code: |
      const name = document.querySelector('[data-testid="refcheck-edit-name-landlord_ref"]');
      const email = document.querySelector('[data-testid="refcheck-edit-email-landlord_ref"]');
      const phone = document.querySelector('[data-testid="refcheck-edit-phone-landlord_ref"]');
      return JSON.stringify({
        name: name ? name.value : '(missing)',
        email: email ? email.value : '(missing)',
        phone: phone ? phone.value : '(missing)',
      });

  - action: javascript
    description: "Fill all three trio fields with the NEW referee contact and prove they hold at +2s"
    code: |
      const set = (testid, value) => {
        const el = document.querySelector('[data-testid="' + testid + '"]');
        if (!el) throw new Error('missing input ' + testid);
        el.value = value;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        return el.value;
      };
      const want = {
        name: 'FIXTURE New Sub Referee',
        email: 'new.sub@fixture.test',
        phone: '0879998888',
      };
      set('refcheck-edit-name-landlord_ref', want.name);
      set('refcheck-edit-email-landlord_ref', want.email);
      set('refcheck-edit-phone-landlord_ref', want.phone);
      await new Promise(r => setTimeout(r, 2000));
      const read = testid =>
        (document.querySelector('[data-testid="' + testid + '"]') || {}).value;
      const got = {
        name: read('refcheck-edit-name-landlord_ref'),
        email: read('refcheck-edit-email-landlord_ref'),
        phone: read('refcheck-edit-phone-landlord_ref'),
      };
      return JSON.stringify({
        expected: want,
        at_2s: got,
        held: got.name === want.name && got.email === want.email && got.phone === want.phone,
      });

  - action: verify
    checks:
      - type: text_visible
        text: "Save & send invite"
      - type: text_visible
        text: "Ask the applicant for another referee and add their details here. We'll send the invitation to them instead."
    description: "Substitute heading, body and save button render"

  - action: javascript
    description: "Save & send invite (native click fallback)"
    code: |
      const save = document.querySelector('[data-testid="refcheck-edit-save-landlord_ref"]');
      if (!save) throw new Error('save button missing');
      save.click();
      return 'submitted';

  - action: verify
    checks:
      - type: toast_visible
        text: "Referee substituted"
        timeout: 3000
    description: "Success toast confirms the substitution"

  - action: wait
    for: "element"
    selector: '[data-testid="refcheck-row-landlord_ref"]'
    timeout: 8000

  - action: javascript
    description: "The panel now shows the NEW queued row with the substituted contact; the objected row is gone"
    code: |
      const rows = Array.from(document.querySelectorAll('[data-testid^="refcheck-row-"]'));
      const pills = Array.from(document.querySelectorAll('[data-testid^="refcheck-status-"]'))
        .map(p => p.innerText.trim());
      return JSON.stringify({
        rowCount: rows.length,
        pills: pills,
        panelText: document.querySelector('[data-testid="refcheck-card"]').innerText,
      });

  - action: verify
    checks:
      - type: text_visible
        text: "FIXTURE New Sub Referee"
      - type: text_visible
        text: "new.sub@fixture.test"
    description: "New landlord_ref row shows the substituted contact"

  - action: javascript
    description: "The NEW row (the one carrying the substituted name) shows the Queued pill"
    code: |
      const rows = Array.from(document.querySelectorAll('[data-testid^="refcheck-row-landlord_ref"]'));
      const newRow = rows.find(r => (r.innerText || '').includes('FIXTURE New Sub Referee'));
      if (!newRow) throw new Error('new substituted row not found');
      const pill = newRow.querySelector('[data-testid^="refcheck-status-"]');
      return 'new row pill: ' + (pill ? pill.innerText.trim() : '(missing)');

expected_outcome: "Substitute referee creates a NEW queued landlord_ref row with the substituted contact; the old objected row is replaced (the #611 substitute-dead-end bug does not recur)."
